j<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un Amor para Siempre</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#e8ddd0;--blush:#c9998a;--rose:#8b3a3a;--dark:#1a1210;--gold:#c4a35a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background-color:var(--cream);color:var(--dark);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;position:relative}
  .hero::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:1px;height:80px;background:linear-gradient(to bottom,var(--blush),transparent)}
  .date-tag{font-weight:200;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--blush);margin-bottom:32px;opacity:0;animation:fadeUp 1s ease .2s forwards}
  .hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,10vw,7rem);font-weight:300;font-style:italic;line-height:1.05;color:var(--dark);opacity:0;animation:fadeUp 1s ease .5s forwards;margin-bottom:24px}
  .hero-sub{font-weight:200;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);opacity:0;animation:fadeUp 1s ease .8s forwards}
  .music-section{padding:80px 24px 60px;display:flex;flex-direction:column;align-items:center;gap:24px}
  .section-label{font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--blush);font-weight:300}
  .player-card{background:var(--dark);color:var(--cream);border-radius:2px;padding:32px 36px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px;box-shadow:0 20px 60px rgba(26,18,16,.15);opacity:0;animation:fadeUp 1s ease 1s forwards}
  .song-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;font-style:italic;color:var(--cream)}
  .song-artist{font-size:.75rem;letter-spacing:.15em;color:var(--blush);text-transform:uppercase;font-weight:200}
  .player-controls{display:flex;flex-direction:column;gap:12px}
  audio{width:100%;height:36px;opacity:.85;border-radius:2px}
  .play-hint{font-size:.68rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;text-align:center;font-weight:200}
  .gallery-section{padding:20px 24px 100px;max-width:900px;margin:0 auto}
  .gallery-header{text-align:center;margin-bottom:48px}
  .gallery-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:300;font-style:italic;color:var(--dark);margin-top:12px}
  .gallery-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:60px;gap:8px}
  .photo{overflow:hidden;position:relative;cursor:pointer;opacity:0;animation:fadeUp .8s ease forwards}
  .photo img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.25,.46,.45,.94);display:block}
  .photo:hover img{transform:scale(1.06)}
  .photo:nth-child(1){grid-column:1/8;grid-row:1/7;animation-delay:.1s}
  .photo:nth-child(2){grid-column:8/13;grid-row:1/5;animation-delay:.25s}
  .photo:nth-child(3){grid-column:8/13;grid-row:5/9;animation-delay:.4s}
  .photo:nth-child(4){grid-column:1/6;grid-row:7/12;animation-delay:.55s}
  .photo:nth-child(5){grid-column:6/13;grid-row:9/14;animation-delay:.7s}
  .photo:nth-child(6){grid-column:1/6;grid-row:12/16;animation-delay:.85s}
  .lightbox{position:fixed;inset:0;background:rgba(26,18,16,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .4s ease}
  .lightbox.open{opacity:1;pointer-events:all}
  .lightbox img{max-width:90vw;max-height:85vh;object-fit:contain}
  .lightbox-close{position:absolute;top:24px;right:32px;color:var(--cream);font-size:1.5rem;cursor:pointer;opacity:.7}
  .footer{text-align:center;padding:40px 24px 60px;border-top:1px solid var(--warm)}
  .footer-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--blush);font-weight:300}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){.gallery-grid{display:flex;flex-direction:column;gap:8px}.photo{height:260px}}
</style>
</head>
<body>
<section class="hero">
  <p class="date-tag">11 · Junio</p>
  <h1 class="hero-title">Un Amor para Siempre</h1>
  <p class="hero-sub">Un momento para recordar siempre</p>
</section>
<section class="music-section">
  <span class="section-label">Nuestra canción</span>
  <div class="player-card">
    <div class="song-info">
      <p class="song-title">La Única Puerta</p>
      <p class="song-artist">Melendi</p>
    </div>
    <div class="player-controls">
      <iframe width="100%" height="80" src="https://www.youtube.com/embed/g51xsAz61bw" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="border-radius:4px;"></iframe>

      <p class="play-hint">♪ Dale play y recuerda</p>
    </div>
  </div>
</section>
<section class="gallery-section">
  <div class="gallery-header">
    <span class="section-label">Galería</span>
    <h2 class="gallery-title">Nuestros momentos</h2>
  </div>
  <div class="gallery-grid">
    <div class="photo" onclick="openLightbox(this)"><img src="IMG_0696.jpeg" alt="Foto 1"></div>
    <div class="photo" onclick="openLightbox(this)"><img src="IMG_1256.jpeg" alt="Foto 2"></div>
    <div class="photo" onclick="openLightbox(this)"><img src="IMG_5273.jpeg" alt="Foto 3"></div>
    <div class="photo" onclick="openLightbox(this)"><img src="IMG_5642.jpeg" alt="Foto 4"></div>
    <div class="photo" onclick="openLightbox(this)"><img src="IMG_6824.jpeg" alt="Foto 5"></div>
    <div class="photo" onclick="openLightbox(this)"><img src="IMG_8450.jpeg" alt="Foto 6"></div>
  </div>
</section>
<footer class="footer">
  <p class="footer-text">"Mi Alicia, gracias por tanto amor."</p>
</footer>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">✕ cerrar</span>
  <img id="lightbox-img" src="" alt="">
</div>
<script>
  function openLightbox(el){document.getElementById('lightbox-img').src=el.querySelector('img').src;document.getElementById('lightbox').classList.add('open')}
  function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()})
</script>
</body>
</html>
